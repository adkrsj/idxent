syntax = "proto3";

package extrent;

message ExtractEntityRequest
{
    string text = 1;                  // text to find Named Entities in it
    repeated string entity_kinds = 2; // list of entity kinds to return, e.g. "PERSON", "ORG"
    bool return_sentence = 3;         // wether to return the containing sentence in NamedEntityRef
}

message NamedEntityRef
{
    string kind = 1;              // e.g. "PERSON", "ORG"
    string value = 2;             // actual name, e.g. "John Smith"
    optional string sentence = 3; // text of the sentence in which the entity is mentioned
}

// Describes named entities, extracted from a given text.
message ExtractEntityResponse
{
    repeated NamedEntityRef entity_refs = 1;
}

// The service to extract Named Entites from text.
service EntityExtractor
{
    rpc ExtractEntity(ExtractEntityRequest) returns (ExtractEntityResponse) {}
}